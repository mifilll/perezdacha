<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#131f24">
<title>ExamLingo — Технологии программирования</title>
<style>
:root {
  --bg: #131f24;
  --card: #1f2c34;
  --card-hover: #26353e;
  --text: #f1f7fb;
  --muted: #8a9aa5;
  --accent: #58cc02;
  --accent-dark: #46a302;
  --wrong: #ff4b4b;
  --wrong-dark: #c73a3a;
  --gold: #ffc800;
  --blue: #1cb0f6;
  --border: #37464f;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
  width: 100%;
}
body {
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: 20px;
  line-height: 1.5;
}
button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; color: inherit; }
img { max-width: 100%; height: auto; }
.hidden { display: none !important; }

/* ==== Topbar ==== */
.topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  max-width: 720px;
  margin: 0 auto;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}
.topbar .back {
  font-size: 22px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  flex-shrink: 0;
}
.topbar .back:active { background: var(--card); color: var(--text); }
.topbar .title {
  flex: 1;
  font-size: 16px;
  font-weight: 700;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.stat {
  display: flex;
  align-items: center;
  gap: 3px;
  font-weight: 700;
  font-size: 14px;
  padding: 6px 9px;
  border-radius: 20px;
  background: var(--card);
  flex-shrink: 0;
}
.stat.fire { color: #ff9600; }
.stat.xp { color: var(--accent); }

/* ==== Container ==== */
.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 16px 20px;
  width: 100%;
  overflow-x: hidden;
}

/* ==== Home ==== */
.home-title {
  font-size: 26px;
  font-weight: 800;
  margin: 20px 0 6px;
  line-height: 1.2;
}
.home-sub {
  color: var(--muted);
  margin-bottom: 24px;
  font-size: 15px;
}
.section-card {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: .15s;
  cursor: pointer;
  margin-bottom: 12px;
  width: 100%;
  text-align: left;
}
.section-card:active {
  border-color: var(--accent);
  background: var(--card-hover);
  transform: scale(0.99);
}
.section-emoji {
  font-size: 32px;
  width: 56px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(88,204,2,0.15);
  border-radius: 12px;
  flex-shrink: 0;
}
.section-info { flex: 1; min-width: 0; }
.section-info h3 { font-size: 16px; margin-bottom: 4px; }
.section-info p { font-size: 13px; color: var(--muted); }
.progress-bar {
  margin-top: 8px;
  height: 6px;
  background: var(--bg);
  border-radius: 3px;
  overflow: hidden;
}
.progress-bar > div {
  height: 100%;
  background: var(--accent);
  transition: width .3s;
}

/* ==== List of lectures ==== */
.item-list { display: flex; flex-direction: column; gap: 10px; }
.list-item {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  width: 100%;
  transition: .15s;
}
.list-item:active {
  border-color: var(--accent);
  background: var(--card-hover);
}
.list-item.done {
  border-color: var(--accent);
  background: rgba(88,204,2,0.08);
}
.list-item .badge {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 800;
  flex-shrink: 0;
}
.list-item.done .badge { background: var(--accent); color: #fff; }
.list-item .body { flex: 1; min-width: 0; }
.list-item .body h4 { font-size: 15px; margin-bottom: 3px; line-height: 1.3; }
.list-item .body p { font-size: 12px; color: var(--muted); }
.list-item .score {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  flex-shrink: 0;
}

/* ==== Lesson ==== */
.lesson-progress {
  height: 10px;
  background: var(--card);
  border-radius: 5px;
  overflow: hidden;
  margin: 8px 0 22px;
}
.lesson-progress > div {
  height: 100%;
  background: var(--accent);
  transition: width .25s;
}
.q-text {
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 20px;
  line-height: 1.35;
  word-wrap: break-word;
}
.answers { display: flex; flex-direction: column; gap: 10px; }
.answer {
  padding: 14px 16px;
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 15px;
  text-align: left;
  transition: .15s;
  line-height: 1.4;
  min-height: 52px;
  word-wrap: break-word;
  width: 100%;
}
.answer:active:not(.disabled) { border-color: var(--blue); }
.answer.correct {
  border-color: var(--accent);
  background: rgba(88,204,2,0.15);
}
.answer.wrong {
  border-color: var(--wrong);
  background: rgba(255,75,75,0.12);
}
.answer.disabled { cursor: default; }

/* ==== Feedback bar ==== */
.feedback {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  padding: 14px 16px;
  padding-bottom: calc(14px + var(--safe-bottom));
  background: var(--card);
  border-top: 2px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 12px;
  z-index: 20;
  animation: slideUp .2s ease;
  max-height: 60vh;
  overflow-y: auto;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.feedback.ok { background: rgba(88,204,2,0.12); border-color: var(--accent); }
.feedback.bad { background: rgba(255,75,75,0.12); border-color: var(--wrong); }
.feedback .head {
  font-size: 16px;
  font-weight: 800;
}
.feedback.ok .head { color: var(--accent); }
.feedback.bad .head { color: var(--wrong); }
.feedback .desc {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.45;
}
.feedback .btn { align-self: flex-end; }

.btn {
  padding: 12px 22px;
  border-radius: 12px;
  font-weight: 800;
  font-size: 15px;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  transition: .1s;
  border-bottom: 3px solid transparent;
  min-height: 46px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.btn:active { transform: translateY(2px); border-bottom-width: 1px; }
.btn.primary {
  background: var(--accent);
  color: #fff;
  border-bottom-color: var(--accent-dark);
}
.btn.wrong {
  background: var(--wrong);
  color: #fff;
  border-bottom-color: var(--wrong-dark);
}
.btn.ghost {
  background: transparent;
  color: var(--muted);
  border-bottom-color: transparent;
}
.btn.full { width: 100%; }

/* ==== Complete ==== */
.complete { text-align: center; padding: 30px 0; }
.complete .big-emoji {
  font-size: 72px;
  margin-bottom: 14px;
  animation: pop .4s ease;
}
@keyframes pop { 0% { transform: scale(0.5); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
.complete h2 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
.complete .sub { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 24px;
}
.stat-box {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 14px 6px;
}
.stat-box .icon { font-size: 22px; margin-bottom: 4px; }
.stat-box .val { font-size: 20px; font-weight: 800; }
.stat-box .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* ==== Lecture reading ==== */
.lecture-body {
  background: var(--card);
  border-radius: 14px;
  padding: 18px;
  border: 2px solid var(--border);
  margin-bottom: 20px;
  overflow-x: hidden;
}
.lecture-body h2 {
  font-size: 19px;
  font-weight: 800;
  color: var(--accent);
  margin: 20px 0 10px;
  line-height: 1.3;
}
.lecture-body h2:first-child { margin-top: 0; }
.lecture-body h3 {
  font-size: 16px;
  font-weight: 700;
  color: var(--blue);
  margin: 16px 0 8px;
}
.lecture-body p {
  font-size: 15px;
  line-height: 1.6;
  margin-bottom: 10px;
  word-wrap: break-word;
}
.lecture-body ul, .lecture-body ol {
  padding-left: 20px;
  margin-bottom: 10px;
}
.lecture-body li {
  font-size: 15px;
  line-height: 1.55;
  margin-bottom: 5px;
  word-wrap: break-word;
}
.lecture-body code {
  background: var(--bg);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: 'SF Mono', Consolas, Monaco, monospace;
  font-size: 13px;
  color: var(--blue);
  word-wrap: break-word;
  overflow-wrap: anywhere;
}
.lecture-body pre {
  background: var(--bg);
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
  overflow-x: auto;
  margin: 10px 0;
  font-family: 'SF Mono', Consolas, Monaco, monospace;
  line-height: 1.4;
  -webkit-overflow-scrolling: touch;
  max-width: 100%;
}
.lecture-body b { color: #fff; font-weight: 700; }
.lecture-body table {
  width: 100%;
  border-collapse: collapse;
  margin: 10px 0;
  font-size: 13px;
  display: block;
  overflow-x: auto;
}
.lecture-body th, .lecture-body td {
  border: 1px solid var(--border);
  padding: 6px 8px;
  text-align: left;
}
.lecture-body th { background: var(--bg); font-weight: 700; }

.reset-btn {
  display: block;
  margin: 30px auto 0;
  color: var(--muted);
  font-size: 12px;
  text-decoration: underline;
  padding: 10px;
}

/* ==== Utilities ==== */
.mb-16 { margin-bottom: 16px; }
.mt-16 { margin-top: 16px; }
.center { text-align: center; }
.text-muted { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div id="app"></div>
<script>

// ============================================================
// ДАННЫЕ
// ============================================================

const COURSE = {
  id: 'tp',
  name: 'Технологии программирования',
  emoji: '💻',
  description: 'C#, .NET, ООП, LINQ, файлы, WinForms',

  // -------- ЛЕКЦИИ --------
  lectures: [
    {
      id: 'l1',
      title: 'Лекция 1. C# и .NET. Ввод-вывод. Условия',
      icon: '1️⃣',
      sections: `
        <h2>1. Кибернетические системы</h2>
        <p><b>Кибернетическая система</b> — множество взаимосвязанных объектов, способных воспринимать, запоминать и перерабатывать информацию, а также обмениваться ею. Примеры: автопилот, компьютер, мозг, общество.</p>
        <p>Кибернетика изучает системы абстрактно, независимо от их физической природы.</p>
        <ul>
          <li><b>Непрерывные</b> — все сигналы и состояния задаются непрерывными параметрами.</li>
          <li><b>Дискретные</b> — все величины дискретны.</li>
          <li><b>Гибридные (смешанные)</b> — оба типа параметров.</li>
          <li><b>Замкнутые (изолированные)</b> — обмен сигналами только внутри системы.</li>
          <li><b>Открытые</b> — есть входные и выходные каналы, обмен с внешней средой.</li>
        </ul>
        <p>Сложные системы отличаются от простых тем, что способны управлять своим поведением и обладают <b>памятью</b>.</p>

        <h2>2. Типы программных систем</h2>
        <ul>
          <li><b>Встроенные (реального времени)</b> — комбинация оборудования и ПО. Примеры: станки с ЧПУ, радиолокация, транспорт. ПО работает непрерывно, в режиме реального времени.</li>
          <li><b>Программно насыщенные</b> — включают компьютеры и пользователей. Примеры: банковские системы, резервирование авиабилетов, интернет. Работают нерегулярно, в ответ на запросы, без жёстких требований ко времени реакции.</li>
          <li><b>Вычислительно-ориентированные</b> — сложные вычисления с большими данными. Примеры: прогноз погоды, криптография. Используют суперкомпьютеры и кластеры.</li>
        </ul>

        <h2>3. Подходы к разработке ПО</h2>
        <ol>
          <li><b>Процедурное</b> — основа — процедуры (именованные фрагменты). Обмен через аргументы. Реализовано в Pascal, C.</li>
          <li><b>Модульное</b> — развитие процедурного. Стандартизация интерфейса модулей, каждый модуль функционально закончен. Turbo Pascal, C.</li>
          <li><b>Нисходящее проектирование</b> — сначала основные функции, затем дополнительные. Пошаговое совершенствование.</li>
          <li><b>Программирование с защитой от ошибок</b> — контроль входных данных, форматов, границ; контроль версий.</li>
          <li><b>Функциональное</b> — программа как последовательность функций. Единственное действие — вызов функции. Пример — Лисп.</li>
          <li><b>Логическое</b> — термины логики, отношения между объектами. Пример — Пролог.</li>
          <li><b>Параллельное</b> — блоки выполняются одновременно. Проблема — синхронизация.</li>
          <li><b>ООП</b> — самое перспективное. Три «кита»: <b>инкапсуляция</b> (объединение состояния и поведения, сокрытие), <b>наследование</b> (класс включает свойства предков), <b>полиморфизм</b> (класс играет роль предка, сохраняя своё поведение).</li>
        </ol>

        <h2>4. Язык C# и платформа .NET</h2>
        <p><b>C#</b> — объектно-ориентированный язык, создан Microsoft под платформу .NET. Первая версия — февраль 2002, вместе с Visual Studio .NET. Синтаксис C-подобный, близок к C++ и Java. Поддерживает инкапсуляцию, наследование, полиморфизм, перегрузку операторов, статическую типизацию. Регистрозависим.</p>
        <p><b>Платформа .NET</b> — основа для создания приложений. Основные черты:</p>
        <ul>
          <li><b>CLR</b> (Common Language Runtime) — общеязыковая среда исполнения, ядро.</li>
          <li>Компиляция в <b>CIL</b> (Common Intermediate Language), поэтому модули могут быть на разных языках: C#, VB.NET, C++, F#, Delphi.NET.</li>
          <li><b>JIT-компиляция</b> — CIL преобразуется в машинный код при запуске, только та часть, к которой идёт обращение. Скомпилированное сохраняется до конца работы.</li>
          <li><b>Управляемый код</b> — CLR сама вызывает сборщик мусора. Есть и неуправляемый (C++), с ним .NET взаимодействует через COM.</li>
          <li><b>Кроссплатформенность</b> — Windows, Linux, macOS, Android, iOS.</li>
          <li>Единая библиотека классов для всех языков.</li>
          <li>Разнообразие технологий: ADO.NET (БД), WPF (графика), ASP.NET (веб).</li>
        </ul>

        <h2>5. Консольный ввод-вывод</h2>
        <p><b>Вывод:</b></p>
        <ul>
          <li><code>Console.WriteLine()</code> — выводит и переходит на новую строку.</li>
          <li><code>Console.Write()</code> — без перехода.</li>
          <li><b>Интерполяция:</b> <code>$"Имя: {name} Возраст: {age}"</code></li>
          <li><b>Составное форматирование:</b> <code>"Имя: {0} Возраст: {1}", name, age</code> — нумерация с 0.</li>
          <li>Форматный вывод: <code>{Height,7:F3}</code> — длина поля 7, 3 знака после запятой.</li>
        </ul>
        <p><b>Ввод:</b></p>
        <ul>
          <li><code>Console.ReadLine()</code> — всегда возвращает <b>строку</b>.</li>
          <li>Для чисел: <code>Convert.ToInt32()</code>, <code>Convert.ToDouble()</code>, <code>Convert.ToDecimal()</code>.</li>
          <li>Дробная часть зависит от локали: в России — запятая.</li>
        </ul>
        <p>Управляющие символы: <code>\\t</code> (табуляция), <code>\\"</code> (кавычка), <code>\\n</code> (перевод строки).</p>

        <h2>6. Условные конструкции</h2>
        <p><b>Операции сравнения:</b> <code>==</code>, <code>!=</code>, <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, <code>&gt;=</code> — возвращают <code>bool</code>.</p>
        <p><b>Логические:</b> <code>||</code> (или), <code>&amp;&amp;</code> (и), <code>!</code> (не), <code>^</code> (исключающее или).</p>
        <p><b>Тернарная:</b> <code>условие ? значение1 : значение2</code></p>
        <pre>if (условие) { ... }
else if (условие) { ... }
else { ... }</pre>
        <p>Блок <code>else</code> необязателен. Если одна инструкция — фигурные скобки можно опустить. В <code>switch</code> каждый <code>case</code> завершается <code>break</code>, иначе «провалится» в следующий.</p>
      `,
      test: [
        { q: 'В каком году вышла первая версия языка C#?', options: ['1998', '2002', '2005', '2010'], correct: 1, explanation: 'C# вышел в феврале 2002 года вместе с Visual Studio .NET.' },
        { q: 'Что такое CLR?', options: ['Язык программирования', 'Common Language Runtime — общеязыковая среда исполнения', 'Компилятор C#', 'Библиотека классов'], correct: 1, explanation: 'CLR — ядро платформы .NET, обеспечивает исполнение управляемого кода.' },
        { q: 'В какой язык компилируется код на C#?', options: ['В машинный код', 'В CIL (Common Intermediate Language)', 'В C++', 'В JavaScript'], correct: 1, explanation: 'Все языки .NET компилируются в CIL — это позволяет объединять модули на разных языках.' },
        { q: 'Что такое JIT-компиляция?', options: ['Компиляция всего кода заранее', 'Компиляция CIL в машинный код при запуске, по мере обращения', 'Компиляция в другой язык', 'Интерпретация построчно'], correct: 1, explanation: 'JIT компилирует CIL в машинный код при первом обращении, что повышает производительность.' },

// ============================================================

const STORAGE_KEY = 'examlingo_v2';

function defaultState() {
  return {
    xp: 0,
    streak: 0,
    lastDay: null,
    lectureDone: {}, // lectureId: { score, total, attempts }
    examDone: null   // { score, total, attempts }
  };
}

let state = loadState();
let view = { name: 'home' };
let lesson = null;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return Object.assign(defaultState(), JSON.parse(raw));
  } catch (e) {}
  return defaultState();
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function todayStr() { return new Date().toISOString().slice(0, 10); }

function registerDay() {
  const today = todayStr();
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  if (state.lastDay === today) return;
  if (state.lastDay === yesterday) state.streak += 1;
  else state.streak = 1;
  state.lastDay = today;
  saveState();
}

// ============================================================
// РЕНДЕР
// ============================================================

const app = document.getElementById('app');

function render() {
  if (view.name === 'home') renderHome();
  else if (view.name === 'course') renderCourse();
  else if (view.name === 'lecture') renderLecture();
  else if (view.name === 'lesson') renderLesson();
  else if (view.name === 'complete') renderComplete();
}

function topbar(title, showBack, backAction) {
  return `<div class="topbar">
    ${showBack ? `<button class="back" onclick="${backAction}">←</button>` : '<div style="width:40px"></div>'}
    <div class="title">${title}</div>
    <div class="stat fire">🔥 ${state.streak}</div>
    <div class="stat xp">⚡ ${state.xp}</div>
  </div>`;
}

function renderHome() {
  const totalLectures = COURSE.lectures.length;
  const doneLectures = Object.keys(state.lectureDone).length;
  const examPct = state.examDone ? Math.round(state.examDone.score / state.examDone.total * 100) : 0;
  app.innerHTML = `
    ${topbar('ExamLingo', false, '')}
    <div class="container">
      <h1 class="home-title">Привет 👋</h1>
      <p class="home-sub">Готовься к пересдаче в формате Дуолинго: читай лекции, проходи тесты.</p>
      <button class="section-card" onclick="goCourse()">
        <div class="section-emoji">${COURSE.emoji}</div>
        <div class="section-info">
          <h3>${COURSE.name}</h3>
          <p>${COURSE.description}</p>
          <div class="progress-bar"><div style="width:${Math.round(doneLectures/totalLectures*100)}%"></div></div>
        </div>
      </button>
      <button class="reset-btn" onclick="resetAll()">Сбросить прогресс</button>
    </div>
  `;
}

function renderCourse() {
  const totalLectures = COURSE.lectures.length;
  const doneLectures = Object.keys(state.lectureDone).length;
  const examPct = state.examDone ? Math.round(state.examDone.score / state.examDone.total * 100) : 0;

  app.innerHTML = `
    ${topbar(COURSE.name, true, 'goHome()')}
    <div class="container">
      <h1 class="home-title" style="font-size:22px">Выбери раздел</h1>

      <button class="section-card" onclick="goLectures()">
        <div class="section-emoji">📖</div>
        <div class="section-info">
          <h3>Лекции</h3>
          <p>${doneLectures} из ${totalLectures} пройдено</p>
          <div class="progress-bar"><div style="width:${Math.round(doneLectures/totalLectures*100)}%"></div></div>
        </div>
      </button>

      <button class="section-card" onclick="startExam()">
        <div class="section-emoji">🎯</div>
        <div class="section-info">
          <h3>Вопросы к сессии</h3>
          <p>${COURSE.exam.questions.length} вопросов — отдельный тест</p>
          ${state.examDone ? `<div class="progress-bar"><div style="width:${examPct}%"></div></div>` : ''}
        </div>
      </button>
    </div>
  `;
}

function goLectures() {
  const items = COURSE.lectures.map((l, i) => {
    const done = state.lectureDone[l.id];
    const scoreText = done ? `${done.score}/${done.total}` : '';
    return `<button class="list-item ${done ? 'done' : ''}" onclick="openLecture('${l.id}')">
      <div class="badge">${done ? '✓' : (i + 1)}</div>
      <div class="body">
        <h4>${l.title}</h4>
        <p>${l.test.length} вопросов в тесте</p>
      </div>
      <div class="score">${scoreText}</div>
    </button>`;
  }).join('');

  app.innerHTML = `
    ${topbar('Лекции', true, 'goCourse()')}
    <div class="container">
      <p class="home-sub">Читай лекцию, потом проходи тест по ней.</p>
      <div class="item-list">${items}</div>
    </div>
  `;
}

function openLecture(id) {
  const l = COURSE.lectures.find(x => x.id === id);
  app.innerHTML = `
    ${topbar(l.title, true, 'goLectures()')}
    <div class="container">
      <div class="lecture-body">${l.sections}</div>
      <button class="btn primary full" onclick="startLectureTest('${l.id}')">
        Пройти тест по лекции →
      </button>
    </div>
  `;
}

function startLectureTest(id) {
  const l = COURSE.lectures.find(x => x.id === id);
  lesson = {
    kind: 'lecture',
    id,
    title: l.title,
    questions: shuffle(l.test.map(q => ({ ...q }))),
    current: 0,
    correctCount: 0,
    selected: null
  };
  view = { name: 'lesson' };
  render();
  window.scrollTo(0, 0);
}

function startExam() {
  lesson = {
    kind: 'exam',
    id: 'exam',
    title: 'Вопросы к сессии',
    questions: shuffle(COURSE.exam.questions.map(q => ({ ...q }))),
    current: 0,
    correctCount: 0,
    selected: null
  };
  view = { name: 'lesson' };
  render();
  window.scrollTo(0, 0);
}

function renderLesson() {
  const q = lesson.questions[lesson.current];
  const total = lesson.questions.length;
  const pct = (lesson.current / total) * 100;
  const selected = lesson.selected;

  const answers = q.options.map((opt, i) => {
    let cls = 'answer';
    if (selected !== null) {
      cls += ' disabled';
      if (i === q.correct) cls += ' correct';
      else if (i === selected) cls += ' wrong';
    }
    return `<button class="${cls}" ${selected === null ? `onclick="pickAnswer(${i})"` : ''}>${opt}</button>`;
  }).join('');

  const isCorrect = selected !== null && selected === q.correct;

  app.innerHTML = `
    ${topbar(lesson.title, true, 'confirmExit()')}
    <div class="container" style="${selected !== null ? 'padding-bottom:220px' : ''}">
      <div class="lesson-progress"><div style="width:${pct}%"></div></div>
      <div class="q-text">${q.q}</div>
      <div class="answers">${answers}</div>
    </div>
    ${selected !== null ? `
      <div class="feedback ${isCorrect ? 'ok' : 'bad'}">
        <div>
          <div class="head">${isCorrect ? '✓ Верно!' : '✗ Неверно'}</div>
          <div class="desc">${q.explanation}</div>
        </div>
        <button class="btn ${isCorrect ? 'primary' : 'wrong'}" onclick="nextQuestion()">
          ${lesson.current + 1 < total ? 'Далее' : 'Завершить'}
        </button>
      </div>
    ` : ''}
  `;
}

function renderComplete() {
  const total = lesson.questions.length;
  const correct = lesson.correctCount;
  const pct = Math.round((correct / total) * 100);
  const emoji = pct === 100 ? '🏆' : pct >= 70 ? '🎉' : '💪';
  const title = pct === 100 ? 'Идеально!' : pct >= 70 ? 'Хороший результат!' : 'Есть куда расти';

  const backTarget = lesson.kind === 'exam' ? 'goCourse()' : 'goLectures()';

  app.innerHTML = `
    ${topbar('Результат', true, backTarget)}
    <div class="container">
      <div class="complete">
        <div class="big-emoji">${emoji}</div>
        <h2>${title}</h2>
        <p class="sub">${pct}% правильных ответов</p>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="icon">✅</div>
            <div class="val">${correct}/${total}</div>
            <div class="lbl">Правильно</div>
          </div>
          <div class="stat-box">
            <div class="icon">⚡</div>
            <div class="val">+${correct * 10}</div>
            <div class="lbl">XP</div>
          </div>
          <div class="stat-box">
            <div class="icon">🔥</div>
            <div class="val">${state.streak}</div>
            <div class="lbl">Стрик</div>
          </div>
        </div>
        <button class="btn primary full" style="margin-bottom:10px" onclick="${backTarget}">К списку</button>
        <button class="btn ghost full" onclick="${lesson.kind === 'exam' ? 'startExam()' : `startLectureTest('${lesson.id}')`}">Пройти заново</button>
      </div>
    </div>
  `;
}

// ============================================================
// НАВИГАЦИЯ
// ============================================================

function goHome() { view = { name: 'home' }; render(); window.scrollTo(0,0); }
function goCourse() { view = { name: 'course' }; render(); window.scrollTo(0,0); }
function goLectures() { view = { name: 'lectures' }; render(); window.scrollTo(0,0); }

function pickAnswer(idx) {
  if (lesson.selected !== null) return;
  lesson.selected = idx;
  if (idx === lesson.questions[lesson.current].correct) lesson.correctCount += 1;
  render();
}

function nextQuestion() {
  if (lesson.current + 1 < lesson.questions.length) {
    lesson.current += 1;
    lesson.selected = null;
    render();
    window.scrollTo(0, 0);
  } else {
    finishLesson();
  }
}

function finishLesson() {
  const total = lesson.questions.length;
  const correct = lesson.correctCount;

  if (lesson.kind === 'exam') {
    const prev = state.examDone || { score: 0, attempts: 0 };
    state.examDone = { score: Math.max(prev.score, correct), total, attempts: prev.attempts + 1 };
  } else {
    const prev = state.lectureDone[lesson.id] || { score: 0, total, attempts: 0 };
    state.lectureDone[lesson.id] = { score: Math.max(prev.score, correct), total, attempts: prev.attempts + 1 };
  }
  state.xp += correct * 10;
  registerDay();
  saveState();
  view = { name: 'complete' };
  render();
  window.scrollTo(0, 0);
}

function confirmExit() {
  if (confirm('Выйти? Прогресс не сохранится.')) {
    if (lesson && lesson.kind === 'exam') goCourse();
    else goLectures();
  }
}

function resetAll() {
  if (confirm('Сбросить весь прогресс?')) {
    state = defaultState();
    saveState();
    render();
  }
}

// ============================================================
// УТИЛИТЫ
// ============================================================

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Регистрация просмотра лекций (для роутинга lectures нужен отдельный рендер)
// Переопределяем render, чтобы учесть lectures
const _oldRender = render;
render = function() {
  if (view.name === 'lectures') return renderLecturesList();
  return _oldRender();
};

function renderLecturesList() {
  const items = COURSE.lectures.map((l, i) => {
    const done = state.lectureDone[l.id];
    const scoreText = done ? `${done.score}/${done.total}` : '';
    return `<button class="list-item ${done ? 'done' : ''}" onclick="openLecture('${l.id}')">
      <div class="badge">${done ? '✓' : (i + 1)}</div>
      <div class="body">
        <h4>${l.title}</h4>
        <p>${l.test.length} вопросов в тесте</p>
      </div>
      <div class="score">${scoreText}</div>
    </button>`;
  }).join('');

  app.innerHTML = `
    ${topbar('Лекции', true, 'goCourse()')}
    <div class="container">
      <p class="home-sub">Читай лекцию, потом проходи тест по ней.</p>
      <div class="item-list">${items}</div>
    </div>
  `;
}

// ============================================================
// СТАРТ
// ============================================================

(function initStreak() {
  if (state.lastDay) {
    const today = todayStr();
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    if (state.lastDay !== today && state.lastDay !== yesterday) {
      state.streak = 0;
      saveState();
    }
  }
})();

render();

</script>
</body>
</html>
